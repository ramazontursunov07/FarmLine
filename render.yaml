# Render.com uchun tayyor sozlama (Blueprint): bitta veb-xizmat (Django + React) va PostgreSQL bazasi
services:
  - type: web
    name: farmline
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: farmline-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: RUN_BOT
        value: "1"

databases:
  - name: farmline-db
    plan: free
