# Render.com uchun tayyor sozlama (Blueprint): bitta veb-xizmat (Django + React).
# Baza bu faylda yaratilmaydi: bepul rejada Render faqat bitta PostgreSQL beradi.
# DATABASE_URL ni Render panelida o'zingiz kiritasiz (mavjud baza yoki Neon/Supabase manzili).
services:
  - type: web
    name: farmline
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: RUN_BOT
        value: "1"
